<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAlgo Charts - yfinance historical demo</title>
  <style>
    :root {
      --bg: #0a0c11; --panel: #0f121a; --elev: #151925; --elev-2: #1b2030;
      --bd: #232a3a; --bd-soft: #1a1f2c; --tx: #d7dce8; --mut: #8b93a7; --faint: #5b6376;
      --acc: #22c1a4; --acc-2: #2dd4bf; --buy: #26a69a; --sell: #ef5350;
      --amber: #e6b53c; --r: 8px; --h: 30px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1100px 500px at 78% -12%, rgba(34,193,164,0.06), transparent), var(--bg);
      background-color: var(--bg);
      color: var(--tx); font: 13px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ── toolbars ───────────────────────────────────────────────── */
    .topbar, .subbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 14px; }
    .topbar { background: linear-gradient(180deg, var(--panel), #0c0f16); border-bottom: 1px solid var(--bd-soft); }
    .subbar { padding: 7px 14px; background: #0c0f16; border-bottom: 1px solid var(--bd-soft); color: var(--mut); }
    /* Mark only at rest; the wordmark unrolls to its right on hover. Animating
       max-width (not display) keeps the reveal continuous, and the toolbar to
       the right slides rather than jumping. */
    .brand { display: inline-flex; align-items: center; font-weight: 700; letter-spacing: .2px;
      gap: 0; cursor: default; }
    .brand-mark { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
    .brand-mark svg { width: 20px; height: 20px; fill: currentColor; color: var(--acc); }
    .brand-name { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      max-width: 0; opacity: 0; overflow: hidden;
      transition: max-width .28s cubic-bezier(.22,.61,.36,1), opacity .2s ease, padding-left .28s cubic-bezier(.22,.61,.36,1); }
    .brand:hover .brand-name, .brand:focus-visible .brand-name { max-width: 220px; opacity: 1; padding-left: 8px; }
    @media (prefers-reduced-motion: reduce) { .brand-name { transition: none; } }
    .brand em { color: var(--acc-2); font-style: normal; font-weight: 700; font-size: 11px; letter-spacing: .8px;
      border: 1px solid #17423a; background: #0e2420; padding: 1px 6px; border-radius: 5px; }
    .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
    .group { display: inline-flex; align-items: center; gap: 6px; }
    .divider { width: 1px; height: 22px; background: var(--bd-soft); margin: 0 2px; }

    .field {
      height: var(--h); background: var(--elev); color: var(--tx); border: 1px solid var(--bd);
      border-radius: 7px; padding: 0 9px; font: inherit; outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .field::placeholder { color: var(--faint); }
    .field:hover { border-color: #2c3446; }
    .field:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(34,193,164,.15); background: var(--elev-2); }
    select.field { cursor: pointer; }
    .field--sym { width: 118px; font-weight: 600; letter-spacing: .3px; }
    .field--qty { width: 64px; text-align: center; }

    .btn {
      height: var(--h); display: inline-flex; align-items: center; gap: 6px; padding: 0 13px;
      background: var(--elev); color: var(--tx); border: 1px solid var(--bd); border-radius: 7px;
      cursor: pointer; font: inherit; font-weight: 600; transition: all .15s;
    }
    .btn:hover { border-color: #33405a; background: var(--elev-2); }
    .btn:active { transform: translateY(1px); }
    .btn--primary { background: linear-gradient(180deg, var(--acc-2), var(--acc)); color: #04231d; border-color: transparent; }
    .btn--primary:hover { filter: brightness(1.08); }
    .btn--ghost { color: var(--mut); }
    .btn--buy { background: linear-gradient(180deg, #2fbfa4, #1f9e88); color: #04231d; border-color: transparent; }
    .btn--sell { background: linear-gradient(180deg, #f0616f, #d6485a); color: #2a0d10; border-color: transparent; }
    .btn--buy:hover, .btn--sell:hover { filter: brightness(1.08); }

    .status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--mut); max-width: 40vw; overflow: hidden; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; box-shadow: 0 0 0 3px rgba(139,147,167,.12); }
    #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; font-size: 12px;
      background: var(--elev); border: 1px solid var(--bd-soft); border-radius: 999px; color: var(--mut); }
    .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
      padding: 4px 10px; border-radius: 7px; border: 1px solid var(--bd-soft); background: var(--elev); color: var(--mut); font-size: 12px; }
    .chk:hover { border-color: #33405a; color: var(--tx); }
    .chk input { accent-color: var(--acc); width: 14px; height: 14px; }
    .lbl { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
    /* Active-indicator chips: one per chart.addIndicator() instance. */
    /* Generated indicator-settings modal. */
    #setmodal { position: fixed; inset: 0; z-index: 60; background: rgba(6,8,12,.55);
      display: flex; align-items: center; justify-content: center; }
    #setmodal[hidden] { display: none; }
    .set-card { width: 340px; max-height: 78vh; display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--bd); border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0,0,0,.55); overflow: hidden; }
    .set-head { display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border-bottom: 1px solid var(--bd-soft); font-weight: 650; color: var(--tx); }
    .set-head button { border: 0; background: transparent; color: var(--faint); font-size: 20px;
      line-height: 1; cursor: pointer; padding: 0 2px; }
    .set-head button:hover { color: var(--tx); }
    .set-tabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--bd-soft); }
    .set-tab { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--mut);
      font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; }
    .set-tab.is-on { color: var(--tx); border-bottom-color: var(--acc); }
    .set-group { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-top: 6px; }
    .set-body { padding: 10px 14px; overflow: auto; display: grid; gap: 9px; }
    .set-row { display: grid; grid-template-columns: 1fr 140px; align-items: center; gap: 10px; }
    .set-row label { color: var(--mut); font-size: 12px; }
    .set-row input, .set-row select { width: 100%; box-sizing: border-box; background: var(--elev);
      color: var(--tx); border: 1px solid var(--bd-soft); border-radius: 7px; padding: 5px 8px; font-size: 12px; }
    .set-row input[type=color] { padding: 2px; height: 28px; cursor: pointer; }
    .set-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 11px 14px;
      border-top: 1px solid var(--bd-soft); }
    .indlist { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 9px;
      border-radius: 7px; border: 1px solid var(--bd-soft); background: var(--elev);
      color: var(--mut); font-size: 12px; }
    .chip b { color: var(--tx); font-weight: 600; }
    .chip .sw { width: 8px; height: 8px; border-radius: 50%; }
    .chip button { border: 0; background: transparent; color: var(--faint); cursor: pointer;
      font-size: 13px; line-height: 1; padding: 2px 3px; border-radius: 4px; }
    .chip button:hover { background: #2a3348; color: #ff9b9b; }
    .spacer { flex: 1 1 auto; }
    .hint { color: var(--faint); font-size: 12px; font-style: italic; }


    /* ── drawing: left tool rail + floating tool widget ─────────── */
    .rail { position: absolute; top: 0; left: 0; bottom: 0; width: 42px; z-index: 20;
      background: #0c0f16; border-right: 1px solid var(--bd-soft);
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; overflow-y: auto; }
    .rail button { width: 32px; height: 32px; display: grid; place-items: center; flex: none;
      background: transparent; border: 1px solid transparent; border-radius: 7px;
      color: var(--mut); cursor: pointer; }
    .rail button:hover { background: var(--elev); color: var(--tx); }
    .rail button.is-on { background: rgba(34,193,164,.16); border-color: #1d6b5e; color: var(--acc-2); }
    .rail .sep { width: 22px; height: 1px; background: var(--bd-soft); margin: 4px 0; flex: none; }
    .rail button { position: relative; }
    .rail svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round; }
    /* Caret marks a group that has a flyout. A filled corner wedge, not a
       chevron: at 9px a stroked chevron blurs, and the wedge reads as "more
       here" without competing with the glyph above it. Hidden at rest so a
       column of eleven buttons stays quiet. */
    .rail .railcaret { position: absolute; right: 0; bottom: 0; line-height: 0;
      opacity: 0; transition: opacity .1s; }
    .rail .railcaret svg { width: 9px; height: 9px; stroke: none; fill: currentColor;
      opacity: .65; }
    .rail button:hover .railcaret { opacity: 1; }
    .rail button.is-on .railcaret { opacity: 1; }
    .rail button.is-on .railcaret svg { opacity: 1; }
    /* Hover label. The native tooltip waits about a second and cannot be
       styled, which is no use on a rail of near-identical glyphs. */
    .rail .railtip { position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
      margin-left: 8px; white-space: nowrap; padding: 4px 8px; border-radius: 4px;
      background: var(--elev-2); color: var(--tx); border: 1px solid var(--bd);
      font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .08s;
      box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 70; }
    .rail button:hover .railtip { opacity: 1; }
    .rail .railtip b { color: var(--faint); font-weight: 400; margin-left: 8px; }

    .railmenu { position: fixed; z-index: 60; min-width: 226px; max-height: 86vh; overflow-y: auto;
      padding: 6px; background: var(--panel); border: 1px solid var(--bd);
      border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
    .railmenu__head { padding: 8px 10px 4px; color: var(--faint); font-size: 10px;
      text-transform: uppercase; letter-spacing: .7px; }
    .railmenu__item .chord { margin-left: auto; color: var(--faint); font-size: 11px;
      font-variant-numeric: tabular-nums; }
    .railmenu__item { display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 7px 10px; background: transparent; border: 0; border-radius: 7px;
      color: var(--tx); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
    .railmenu__item:hover { background: var(--elev-2); }
    .railmenu__item.is-on { background: rgba(34,193,164,.16); color: var(--acc-2); }
    .railmenu__item svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .stage.has-rail #chart { left: 42px; }

    /* Floating properties bar for the selected drawing — draggable by its grip. */
    #toolwidget { position: absolute; z-index: 40; display: flex; align-items: center; gap: 2px;
      padding: 4px 6px; background: var(--panel); border: 1px solid var(--bd);
      border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.5); user-select: none; }
    #toolwidget[hidden] { display: none; }
    #toolwidget .grip { cursor: grab; color: var(--faint); padding: 0 4px; letter-spacing: -2px; font-size: 15px; }
    #toolwidget .grip:active { cursor: grabbing; }
    #toolwidget button { width: 28px; height: 28px; display: grid; place-items: center;
      background: transparent; border: 0; border-radius: 6px; color: var(--mut); cursor: pointer; }
    #toolwidget button:hover { background: var(--elev-2); color: var(--tx); }
    #toolwidget button.danger:hover { color: #ff8b8b; }
    #toolwidget .vsep { width: 1px; height: 18px; background: var(--bd-soft); margin: 0 3px; }
    #toolwidget svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6;
      stroke-linecap: round; stroke-linejoin: round; }
    .swatch { width: 20px; height: 20px; border-radius: 5px; border: 1px solid #0006; }
    #toolwidget .wbtn { width: auto; padding: 0 7px; font: inherit; font-size: 12px; color: var(--tx); }

    .textedit { position: absolute; z-index: 45; background: var(--elev-2);
      border: 1px solid var(--acc); border-radius: 5px; padding: 2px 6px;
      font: inherit; outline: none; min-width: 90px; }

    #textmodal { position: fixed; inset: 0; z-index: 60; background: rgba(6,8,12,.55);
      display: flex; align-items: center; justify-content: center; }
    #textmodal[hidden] { display: none; }
    .td-card { width: 330px; }
    .td-body { padding: 12px 14px; display: grid; gap: 10px; }
    .td-row { display: flex; align-items: center; gap: 8px; }
    .td-row select { flex: 1 1 auto; min-width: 0; background: var(--elev); color: var(--tx);
      border: 1px solid var(--bd-soft); border-radius: 7px; padding: 5px 8px; font-size: 12px; }
    .td-row input[type=color], .td-check input[type=color] {
      width: 32px; height: 28px; padding: 2px; background: var(--elev);
      border: 1px solid var(--bd-soft); border-radius: 7px; cursor: pointer; flex: none; }
    .td-tog { width: 30px; height: 28px; flex: none; background: var(--elev); color: var(--mut);
      border: 1px solid var(--bd-soft); border-radius: 7px; cursor: pointer; font-size: 13px; }
    .td-tog.is-on { background: rgba(34,193,164,.18); border-color: #1d6b5e; color: var(--acc-2); }
    #td-text { width: 100%; box-sizing: border-box; resize: vertical; background: var(--elev);
      color: var(--tx); border: 1px solid var(--bd-soft); border-radius: 7px; padding: 8px;
      font: inherit; font-size: 13px; outline: none; }
    #td-text:focus { border-color: var(--acc); }
    .td-check { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 12px; cursor: pointer; }
    .td-check input[type=checkbox] { accent-color: var(--acc); width: 15px; height: 15px; }
    .td-check span { flex: 1 1 auto; }
    .td-check input[type=number] { width: 66px; background: var(--elev); color: var(--tx);
      border: 1px solid var(--bd-soft); border-radius: 7px; padding: 4px 6px; font-size: 12px; }

    /* Colour + opacity popover */
    #colorpop { position: absolute; z-index: 41; width: 236px; padding: 10px;
      background: var(--panel); border: 1px solid var(--bd); border-radius: 10px;
      box-shadow: 0 14px 40px rgba(0,0,0,.55); }
    #colorpop[hidden] { display: none; }
    .swgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .swgrid button { width: 100%; aspect-ratio: 1; border-radius: 4px; border: 1px solid #0005; cursor: pointer; padding: 0; }
    .swgrid button.is-on { outline: 2px solid var(--acc-2); outline-offset: 1px; }
    #colorpop .lbl { display: block; margin: 10px 0 4px; }
    #colorpop input[type=range] { width: 100%; accent-color: var(--acc); }
    .poprow { display: flex; align-items: center; gap: 8px; }
    .poprow output { font-size: 12px; color: var(--mut); min-width: 40px; text-align: right; }


    /* ── Terminal shell bar ─────────────────────────────── */
    .shellbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; flex-wrap: wrap;
      background: linear-gradient(180deg, var(--panel), #0c0f16); border-bottom: 1px solid var(--bd-soft); }
    .legacy { display: none !important; }
    .tbtn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px;
      background: transparent; border: 1px solid transparent; border-radius: 7px;
      color: var(--tx); font: inherit; font-size: 13px; cursor: pointer; }
    .tbtn:hover { background: var(--elev); border-color: var(--bd-soft); }
    .tbtn.is-on { background: rgba(34,193,164,.16); border-color: #1d6b5e; color: var(--acc-2); }
    .tbtn b { font-weight: 700; letter-spacing: .3px; }
    .tbtn--icon { padding: 0; width: 30px; justify-content: center; }
    .shellbar svg, .menu svg { width: 17px; height: 17px; fill: none; stroke: currentColor;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .pills { display: inline-flex; background: var(--elev); border: 1px solid var(--bd-soft); border-radius: 8px; padding: 2px; }
    .pills button { height: 24px; padding: 0 9px; background: transparent; border: 0; border-radius: 6px;
      color: var(--mut); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
    .pills button:hover { color: var(--tx); }
    .pills button.is-on { background: var(--elev-2); color: var(--acc-2); }
    /* the live symbol input, shown only while editing */
    #symbol.is-live { position: fixed; top: 44px; left: 96px; z-index: 70; display: block;
      width: 190px; height: 34px; }
    #symbol { display: none; }

    .menu { position: fixed; z-index: 80; min-width: 190px; max-height: 70vh; overflow: auto;
      padding: 5px; background: var(--panel); border: 1px solid var(--bd); border-radius: 10px;
      box-shadow: 0 14px 40px rgba(0,0,0,.55); }
    .menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px;
      background: transparent; border: 0; border-radius: 6px; color: var(--tx);
      font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
    .menu button:hover { background: var(--elev-2); }
    .menu button em { margin-left: auto; color: var(--acc-2); font-style: normal; }
    .menu-group { padding: 7px 8px 3px; color: var(--faint); font-size: 11px;
      text-transform: uppercase; letter-spacing: .5px; }

    /* ── chart stage ────────────────────────────────────────────── */
    .stage { position: relative; flex: 1 1 auto; min-height: 0; }
    #chart { position: absolute; inset: 0; cursor: crosshair; }
    /* Full-screening the stage takes it out of the page flow, so it needs its
       own background -- the browser backdrop is black and the panes are only
       painted where the chart draws. */
    .stage:fullscreen { background: var(--bg); }
    .fsexit { position: absolute; top: 8px; right: 10px; z-index: 40; width: 30px; height: 30px;
      display: grid; place-items: center; border: 1px solid var(--bd-soft); border-radius: 7px;
      background: var(--elev); color: var(--mut); cursor: pointer; opacity: .35; transition: opacity .15s; }
    .fsexit:hover { opacity: 1; color: var(--tx); }
    .fsexit svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6;
      stroke-linecap: round; stroke-linejoin: round; }
    /* OHLC legend overlay, sits on top of the plot, never intercepts the crosshair */
    #legend {
      position: absolute; top: 14px; left: 16px; z-index: 10; pointer-events: none; white-space: nowrap;
      padding: 8px 12px; border-radius: 10px; font: 12px/1.5 system-ui, sans-serif;
      background: rgba(15,18,26,.72); border: 1px solid var(--bd-soft); backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    #legend:empty { display: none; }
    #legend .name { color: #eef1f7; font-weight: 700; font-size: 13px; }
    #legend .meta { opacity: .5; }
    #legend .lbl { opacity: .55; margin-left: 8px; }

    /* Bracket panel: pills glued to the entry/TP/SL prices, draggable */
    #bracket { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
    #bracket .bk {
      position: absolute; left: 16px; transform: translateY(-50%); display: inline-flex; align-items: center;
      gap: 12px; font: 11px/1 system-ui, sans-serif; padding: 7px 11px; border-radius: 9px; white-space: nowrap;
      pointer-events: auto; box-shadow: 0 6px 18px rgba(0,0,0,.5); user-select: none; border: 1px solid transparent;
    }
    #bracket .bk b { color: #fff; font-weight: 700; }
    #bracket .bk.tp { background: linear-gradient(180deg, #12a98f, #0e9c84); color: #d7f5ee; cursor: ns-resize; }
    #bracket .bk.sl { background: linear-gradient(180deg, #cf4653, #c0414c); color: #fadadd; cursor: ns-resize; }
    #bracket .bk.entry { background: rgba(20,24,36,.94); border-color: #2c3349; color: #b8c0d2; cursor: move; backdrop-filter: blur(6px); }
    #bracket .bk .pnl { font-weight: 800; color: #fff; }
    #bracket .bk button { font: 11px/1 system-ui; font-weight: 600; border-radius: 6px; padding: 5px 10px; cursor: pointer; border: 1px solid transparent; color: #fff; transition: filter .12s; }
    #bracket .bk button:hover { filter: brightness(1.12); }
    #bracket .bk .bk-x { background: transparent; color: #9aa3b2; border-color: #2c3349; padding: 4px 9px; }
    #bracket .bk .bk-x:hover { color: #fff; border-color: #46506a; filter: none; }
    #bracket .bk .bk-buy { background: #1f9e88; }
    #bracket .bk .bk-sell { background: #d6485a; }
    #bracket .bk .bk-mod { background: #2c3349; color: #c7ccd8; }

    /* right-click order menu */
    #ctxmenu {
      position: fixed; z-index: 30; min-width: 210px; padding: 6px;
      background: var(--elev); border: 1px solid var(--bd); border-radius: 11px;
      box-shadow: 0 16px 40px rgba(0,0,0,.55); font: 13px system-ui, sans-serif;
    }
    #ctxmenu button {
      display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: transparent;
      border: 0; border-radius: 7px; color: var(--tx); padding: 7px 10px; cursor: pointer; transition: background .12s, color .12s;
    }
    #ctxmenu button:hover { background: var(--elev-2); }
    #ctxmenu button.buy:hover { background: #12332e; color: #7fe6d2; }
    #ctxmenu button.sell:hover { background: #331a1d; color: #f7a6a4; }
    #ctxmenu button::before { content: ''; width: 7px; height: 7px; border-radius: 2px; flex: none; background: #3a4258; }
    #ctxmenu button.buy::before { background: var(--buy); }
    #ctxmenu button.sell::before { background: var(--sell); }
    #ctxmenu button[data-act="cancelall"]::before { background: var(--faint); }
    #ctxmenu hr { border: 0; border-top: 1px solid var(--bd-soft); margin: 5px 8px; }
  </style>
</head>
<body>
  <header class="shellbar" id="shellbar"></header>
  <header class="topbar legacy">
    <div class="brand"><span class="brand-dot"></span> OpenAlgo <em>yfinance</em></div>
    <div class="divider"></div>
    <div class="group">
      <input type="text" id="symbol" class="field field--sym" value="AAPL" title="Yahoo Finance symbol (AAPL, MSFT, RELIANCE.NS, ^NSEI, BTC-USD)" />
      <select id="interval" class="field" title="bar interval">
        <option>1d</option><option>1h</option><option>30m</option><option>15m</option><option>5m</option><option>1wk</option>
      </select>
      <select id="period" class="field" title="history range">
        <option>1mo</option><option selected>1y</option><option>6mo</option><option>5y</option><option>max</option>
      </select>
      <select id="ctype" class="field" title="chart type">
        <optgroup label="Time-indexed">
          <option value="candlestick">Candles</option>
          <option value="hollow-candle">Hollow Candles</option>
          <option value="bar">Bars (OHLC)</option>
          <option value="high-low">High-Low</option>
          <option value="volume-candle">Volume Candles</option>
          <option value="line">Line</option>
          <option value="line-markers">Line + Markers</option>
          <option value="step">Step Line</option>
          <option value="area">Area</option>
          <option value="hlc-area">HLC Area</option>
          <option value="baseline">Baseline</option>
        </optgroup>
        <optgroup label="Transforms (movement-driven)">
          <option value="t:heikin-ashi">Heikin Ashi</option>
          <option value="t:renko">Renko</option>
          <option value="t:range">Range Bars</option>
          <option value="t:line-break">Line Break</option>
          <option value="t:point-figure">Point &amp; Figure</option>
          <option value="t:kagi">Kagi</option>
        </optgroup>
      </select>
      <select id="pfmode" class="field" title="Point &amp; Figure box sizing" hidden>
        <option value="atr">P&amp;F: ATR box</option>
        <option value="percent">P&amp;F: 1% box</option>
        <option value="fixed">P&amp;F: fixed box</option>
      </select>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button id="load" class="btn btn--primary">Load</button>
      <button id="save" class="btn" title="Save the full chart as a PNG (right-click only captures the overlay)">Save PNG</button>
      <button id="fit" class="btn" title="restore the default view (fit bars + auto price scale), same as double-click">Fit</button>
    </div>
    <div class="status"><span class="status-dot"></span><span id="status"></span></div>
  </header>

  <div class="subbar legacy">
    <span class="lbl">Indicators</span>
    <div class="group">
      <select id="indpick" class="field" title="add an indicator from the openalgo-charts/indicators tier"></select>
      <button id="indadd" class="btn">Add</button>
      <span id="indlist" class="indlist"></span>
    </div>
    <div class="divider"></div>
    <span class="lbl">Draw</span>
    <div class="group">
      <select id="drawtool" class="field" title="drawing tool (openalgo-charts/draw)"></select>
      <button id="drawundo" class="btn" title="undo">&#8630;</button>
      <button id="drawredo" class="btn" title="redo">&#8631;</button>
      <button id="drawdel" class="btn" title="delete selected">Del</button>
      <button id="drawclear" class="btn btn--ghost" title="remove all drawings">Clear</button>
      <label class="chk" title="snap anchors to O/H/L/C"><input type="checkbox" id="magnet" /> <span>Magnet</span></label>
    </div>
    <div class="divider"></div>
    <span class="lbl">Layout</span>
    <div class="group">
      <button id="lsave" class="btn" title="chart.getState() -> localStorage">Save</button>
      <button id="lload" class="btn" title="chart.restoreState() from localStorage">Restore</button>
      <label class="chk"><input type="checkbox" id="vgrid" checked /> <span>V Grid</span></label>
      <label class="chk"><input type="checkbox" id="hgrid" checked /> <span>H Grid</span></label>
    </div>
    <div class="divider"></div>
    <span class="lbl">Order</span>
    <div class="group">
      <input type="number" id="qty" class="field field--qty" value="100" min="1" title="order quantity" />
      <select id="product" class="field" title="product (OpenAlgo order constant)">
        <option value="MIS">MIS</option><option value="CNC">CNC</option><option value="NRML">NRML</option>
      </select>
      <button id="buy" class="btn btn--buy" title="Place a Buy OCO bracket: entry + target + stop (target and stop are OCO)">Buy Bracket</button>
      <button id="sell" class="btn btn--sell" title="Place a Sell OCO bracket: entry + target + stop (target and stop are OCO)">Sell Bracket</button>
      <button id="cancel" class="btn btn--ghost" title="Cancel the bracket + all orders">Cancel</button>
    </div>
    <span class="spacer"></span>
    <span class="hint">bracket = entry + OCO target/stop · right-click for single orders · hover the bottom of the chart for zoom / step controls</span>
  </div>

  <main class="stage has-rail">
    <div class="rail" id="rail"></div>
    <div id="chart"></div>
    <div id="legend"></div>
  </main>

  <!-- Sahi-style bracket panel (positions tracked to price every frame) -->
  <div id="bracket" hidden>
    <div class="bk tp" id="bk-tp">
      <span>TP: <b class="pts">0</b> Pts (<span class="pct">0%</span>)</span>
      <span class="pnl">+0</span>
    </div>
    <div class="bk entry" id="bk-entry">
      <button class="bk-x" data-act="cancel" title="Cancel bracket">x</button>
      <span>Qty: <b class="q">0</b></span>
      <span>Risk/Reward: <b class="rr">0</b></span>
      <button class="bk-buy" data-act="place">1-Click</button>
      <button class="bk-mod" data-act="modify">Modify</button>
    </div>
    <div class="bk sl" id="bk-sl">
      <span>SL: <b class="pts">0</b> Pts (<span class="pct">0%</span>)</span>
      <span class="pnl">-0</span>
    </div>
  </div>

  <!-- broker-style right-click order menu (price under the cursor) -->
  <!-- Indicator settings. The form is GENERATED from the descriptor's `inputs`,
       so it works for every registered indicator, including your own. -->
  <div id="setmodal" hidden>
    <div class="set-card">
      <div class="set-head"><span id="set-title"></span><button id="set-x" title="close">×</button></div>
      <div class="set-tabs">
        <button class="set-tab is-on" data-tab="inputs">Inputs</button>
        <button class="set-tab" data-tab="style">Style</button>
      </div>
      <div id="set-body" class="set-body"></div>
      <div class="set-foot">
        <button id="set-reset" class="btn btn--ghost">Defaults</button>
        <button id="set-ok" class="btn btn--primary">Apply</button>
      </div>
    </div>
  </div>

  <!-- Floating properties bar for the selected drawing. Drag it by the grip. -->
  <div id="toolwidget" hidden></div>
  <!-- Text settings: the drawing is canvas-rendered, so this edits its style bag. -->
  <div id="textmodal" hidden><div class="set-card td-card" id="textdlg"></div></div>
  <div id="colorpop" hidden></div>

  <div id="ctxmenu" hidden>
    <button class="buy" data-side="BUY" data-type="MARKET">Buy Market</button>
    <button class="sell" data-side="SELL" data-type="MARKET">Sell Market</button>
    <hr>
    <button class="buy" data-side="BUY" data-type="LIMIT">Buy Limit</button>
    <button class="sell" data-side="SELL" data-type="LIMIT">Sell Limit</button>
    <hr>
    <button class="buy" data-side="BUY" data-type="SL">Buy Stop (SL)</button>
    <button class="sell" data-side="SELL" data-type="SL">Sell Stop (SL)</button>
    <hr>
    <button data-act="cancelall">Cancel All Orders</button>
    <hr>
    <button data-act="delsel">Delete Drawing</button>
    <button data-act="delall">Remove All Drawings</button>
  </div>

  <script type="module">
    import { createChart, darkTheme, registeredIndicators, getIndicator, indicatorStyleInputs, INDICATOR_SOURCES, LogoWatermark, PaneLegend } from '/dist/openalgo-charts.mjs';
    // Lazy tiers. Each registers into the base bundle's registries as a side
    // effect of being imported, so `addSeries('point-figure')` and
    // `addIndicator('macd')` resolve afterwards.
    import {
      runTransform, HeikinAshiTransform, RenkoTransform, RangeBarsTransform,
      LineBreakTransform, PointFigureTransform, KagiTransform,
    } from '/dist/openalgo-charts.transform.mjs';
    import '/dist/openalgo-charts.indicators.mjs';
    import { DrawingController, BUILTIN_DRAWING_TOOLS, drawingShortcuts, matchDrawingShortcut } from '/dist/openalgo-charts.draw.mjs';

    // A broker-agnostic DataFeed for yfinance: getBars hits this demo's /api/history,
    // which already returns the chart's Bar shape (time in UTC seconds).
    class YFinanceDataFeed {
      async getBars(req) {
        const url = `/api/history?symbol=${encodeURIComponent(req.symbol)}&interval=${req.interval}&period=${req.period}`;
        const res = await fetch(url);
        const json = await res.json();
        if (!res.ok || json.error) throw new Error(json.error || `history failed (${res.status})`);
        return json; // already Bar[]
      }
    }

    const feed = new YFinanceDataFeed();
    const UP = '#26a69a', DOWN = '#ef5350';
    const TRADE_EXTENT = 0.30; // order/bracket lines span only the rightmost 30% (broker-style)
    let chart, price, volume;

    // Active indicators, as {indicatorId, settings} specs. They are re-applied on
    // every chart rebuild (a chart-type switch destroys and recreates the chart),
    // which is also exactly what chart.getState()/restoreState() persists.
    let activeIndicators = [{ indicatorId: 'supertrend', settings: {} }, { indicatorId: 'rsi', settings: {} }];
    const LAYOUT_KEY = 'oa-charts-layout';

    // ── Family-B transforms ────────────────────────────────────────────────
    // A transform re-buckets bars by price movement rather than the clock, so one
    // source bar can emit zero, one, or many elements. Renko/Range/Line Break/HA
    // plot as candles; P&F and Kagi have their own renderers (transform tier).
    function applyTransform(kind, bars) {
      if (!bars.length) return { type: 'candlestick', data: bars };
      // Scale the box/range to the instrument so one setting suits AAPL and BTC.
      const span = bars.reduce((m, b) => Math.max(m, b.high), 0) - bars.reduce((m, b) => Math.min(m, b.low), Infinity);
      const box = Math.max(1e-6, span / 40);
      switch (kind) {
        case 'heikin-ashi':
          return { type: 'candlestick', data: runTransform(new HeikinAshiTransform(), bars) };
        case 'renko':
          return { type: 'candlestick', data: runTransform(new RenkoTransform({ boxSize: box }), bars) };
        case 'range':
          return { type: 'candlestick', data: runTransform(new RangeBarsTransform({ range: box * 2 }), bars) };
        case 'line-break':
          return { type: 'candlestick', data: runTransform(new LineBreakTransform({ lines: 3 }), bars) };
        case 'kagi':
          return { type: 'kagi', data: runTransform(new KagiTransform({ reversal: box * 2 }), bars) };
        case 'point-figure': {
          // Box-size modes are new: 'atr' and 'percent' re-resolve the box each
          // time a column opens, so the grid tracks volatility / price level.
          const mode = el('pfmode').value;
          const opts = mode === 'atr' ? { mode: 'atr', atrPeriod: 14, reversal: 3 }
            : mode === 'percent' ? { mode: 'percent', percent: 1, reversal: 3 }
            : { boxSize: box, reversal: 3 };
          // Columns carry their own boxSize, so the series needs no style.boxSize.
          return { type: 'point-figure', data: runTransform(new PointFigureTransform(opts), bars) };
        }
        default:
          return { type: 'candlestick', data: bars };
      }
    }

    // Resting orders placed by right-click: each is one draggable price line.
    let orders = [];   // { id, side, type, price, qty, product, line }
    let nextOrderId = 1;
    // Market fills build a net position (avg price) shown as a solid line + arrow markers.
    let position = null;   // { netQty, avgPrice }
    let posLine = null;    // PriceLine for the position
    let fills = [];        // marker list for executed market orders
    let markersApi = null; // SeriesMarkers handle on the price series

    // Persist trade state per symbol so orders/bracket/position survive a refresh.
    const STORE_KEY = (sym) => 'oa-charts-trade:' + sym;
    function saveState() {
      if (!req.symbol) return;
      try {
        localStorage.setItem(STORE_KEY(req.symbol), JSON.stringify({
          orders: orders.map((o) => ({ id: o.id, side: o.side, type: o.type, price: o.price, qty: o.qty, product: o.product })),
          nextOrderId, bracket, position, fills,
        }));
      } catch (_) {}
    }
    function restoreState(sym) {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(STORE_KEY(sym)) || 'null'); } catch (_) {}
      orders = s && s.orders ? s.orders.map((o) => ({ ...o, line: null })) : [];
      nextOrderId = s && s.nextOrderId ? s.nextOrderId : 1;
      bracket = s ? s.bracket || null : null;
      position = s ? s.position || null : null;
      fills = s && s.fills ? s.fills : [];
    }
    let currentBars = [];          // cached so a chart-type switch needs no refetch
    const idxByTime = new Map();   // bar time -> array index (for previous-close lookup)
    let req = {};                  // last-loaded request (symbol/interval/period)

    const el = (id) => document.getElementById(id);
    const fmt = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const round2 = (n) => Math.round(n * 100) / 100;
    function fmtVol(v) {
      if (v == null) return '';
      const a = Math.abs(v);
      if (a >= 1e9) return (v / 1e9).toFixed(2) + 'B';
      if (a >= 1e6) return (v / 1e6).toFixed(2) + 'M';
      if (a >= 1e3) return (v / 1e3).toFixed(2) + 'K';
      return String(v);
    }
    function exchangeOf(sym) {
      const s = sym.toUpperCase();
      if (s.endsWith('.NS')) return 'NSE';
      if (s.endsWith('.BO')) return 'BSE';
      if (s.startsWith('^')) return 'INDEX';
      if (s.endsWith('-USD')) return 'CRYPTO';
      return 'yfinance';
    }
    const nameOf = (sym) => sym.toUpperCase().replace(/\.(NS|BO)$/, '');

    // Title + O H L C V + change(%). Driven by the crosshair; falls back to the last bar.
    // The symbol row is a PaneLegend like every indicator row, not a floating
    // DOM box: an opaque overlay sat on top of the indicator legends and hid
    // them. As row 0 of pane 0 it shares the same stack, so indicator rows
    // simply flow underneath it.
    let symbolLegend = null;
    let volLegend = null;
    function setLegend(bar) {
      if (!symbolLegend) return;
      symbolLegend.setOptions({
        title: nameOf(req.symbol || ''),
        params: `${(req.interval || '').toUpperCase()} · ${exchangeOf(req.symbol || '')}`,
      });
      if (!bar) { symbolLegend.setValues([]); volLegend && volLegend.setValues([]); return; }
      const i = idxByTime.get(bar.time);
      const prevClose = (i != null && i > 0) ? currentBars[i - 1].close : bar.open;
      const chg = bar.close - prevClose;
      const pct = prevClose ? (chg / prevClose) * 100 : 0;
      const sign = chg >= 0 ? '+' : '';
      const col = bar.close >= bar.open ? UP : DOWN;
      // Dimmed O/H/L/C labels with colored numbers, one segment each.
      symbolLegend.setValues([
        { label: 'O', text: fmt(bar.open), color: col },
        { label: 'H', text: fmt(bar.high), color: col },
        { label: 'L', text: fmt(bar.low), color: col },
        { label: 'C', text: fmt(bar.close), color: col },
        { text: `${sign}${fmt(chg)} (${sign}${pct.toFixed(2)}%)`, color: chg >= 0 ? UP : DOWN },
      ]);
      // Volume gets its own row, the way a volume study would.
      if (volLegend) volLegend.setValues([{ text: fmtVol(bar.volume ?? 0), color: col }]);
    }

    // ── Sahi-style bracket (entry / target / stop) ──────────────────────────
    let bracket = null;   // { side, entry, target, stop, qty }
    let bLines = null;    // { entry, tp, sl } price-line primitives on the current chart
    const rupee = (n) => (n < 0 ? '-' : '+') + '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');
    const chartTop = () => el('chart').getBoundingClientRect().top;

    function makeBracket(side) {
      if (!currentBars.length) return;
      const entry = round2(currentBars[currentBars.length - 1].close);
      const qty = Math.max(1, Number(el('qty').value) || 1);
      bracket = {
        side, entry, qty,
        target: round2(side === 'BUY' ? entry * 1.012 : entry * 0.988),
        stop: round2(side === 'BUY' ? entry * 0.99 : entry * 1.01),
      };
      attachBracketLines();
      el('bracket').hidden = false;
      el('bk-entry').querySelector('[data-act="place"]').className = side === 'BUY' ? 'bk-buy' : 'bk-sell';
      updateBracket();
      saveState();
    }

    // (Re)create the three dashed price lines on the current chart. They auto-sync
    // with pan/zoom and are draggable through the chart's subscribeDrag.
    function attachBracketLines() {
      if (!bracket) return;
      const pl = (price, color, id) => chart.addPriceLine(
        { price, color, lineWidth: 1, dashed: true, id, cursor: 'ns-resize', extentFromRight: TRADE_EXTENT }, 0);
      bLines = {
        entry: pl(bracket.entry, '#8a93a7', 'bk-entry'),
        tp: pl(bracket.target, UP, 'bk-tp'),
        sl: pl(bracket.stop, DOWN, 'bk-sl'),
      };
    }

    // Move one leg (or the whole bracket via the entry) and keep TP/SL on the
    // correct side of entry, then refresh lines, labels and pill positions.
    function setBracketPrice(which, raw) {
      if (!bracket) return;
      const p = round2(raw);
      const buy = bracket.side === 'BUY';
      if (which === 'entry') {
        const d = p - bracket.entry;
        bracket.entry = p; bracket.target = round2(bracket.target + d); bracket.stop = round2(bracket.stop + d);
      } else if (which === 'tp') {
        bracket.target = buy ? Math.max(p, bracket.entry + 0.01) : Math.min(p, bracket.entry - 0.01);
      } else {
        bracket.stop = buy ? Math.min(p, bracket.entry - 0.01) : Math.max(p, bracket.entry + 0.01);
      }
      updateBracket();
      saveState();
    }

    function updateBracket() {
      if (!bracket || !bLines) return;
      bLines.entry.setPrice(bracket.entry); bLines.tp.setPrice(bracket.target); bLines.sl.setPrice(bracket.stop);
      const sign = bracket.side === 'BUY' ? 1 : -1;
      const tpPts = Math.abs(bracket.target - bracket.entry);
      const slPts = Math.abs(bracket.entry - bracket.stop);
      const tpPnl = sign * (bracket.target - bracket.entry) * bracket.qty;
      const slPnl = sign * (bracket.stop - bracket.entry) * bracket.qty;
      const rr = slPts > 0 ? tpPts / slPts : 0;
      const set = (id, pts, pnl) => {
        const n = el(id);
        n.querySelector('.pts').textContent = fmt(pts);
        n.querySelector('.pct').textContent = (pts / bracket.entry * 100).toFixed(2) + '%';
        n.querySelector('.pnl').textContent = rupee(pnl);
      };
      set('bk-tp', tpPts, tpPnl);
      set('bk-sl', slPts, slPnl);
      const e = el('bk-entry');
      e.querySelector('.q').textContent = bracket.qty;
      e.querySelector('.rr').textContent = rr.toFixed(2);
      e.querySelector('[data-act="place"]').textContent = '1-Click ' + (bracket.side === 'BUY' ? 'Buy' : 'Sell');
      positionPills();
    }

    // Glue each pill to its price and to the LEFT end of the 30% line (viewport
    // coords), clamped to stay on the chart and off the price axis.
    function positionPills() {
      if (!bracket || el('bracket').hidden) return;
      const rect = el('chart').getBoundingClientRect();
      const plotW = Math.max(0, rect.width - 72); // priceAxisWidth
      const lineLeftX = rect.left + plotW * (1 - TRADE_EXTENT);
      const at = { 'bk-tp': bracket.target, 'bk-entry': bracket.entry, 'bk-sl': bracket.stop };
      for (const id in at) {
        const y = chart ? chart.priceToCoordinate(at[id], 0) : null;
        const node = el(id);
        if (y == null) { node.style.display = 'none'; continue; }
        node.style.display = '';
        node.style.top = (rect.top + y) + 'px';
        node.style.left = Math.max(rect.left + 8, Math.min(lineLeftX, rect.right - node.offsetWidth - 84)) + 'px';
      }
    }
    function removeBracket() {
      if (bLines && chart) for (const k in bLines) chart.removePrimitive(bLines[k]);
      bracket = null; bLines = null; el('bracket').hidden = true;
    }

    // ── Resting orders (right-click) - each a draggable broker-style line ──
    function orderLine(o) {
      return chart.addPriceLine({
        price: o.price, color: o.side === 'BUY' ? UP : DOWN, lineWidth: 1, dashed: true,
        id: `order:${o.id}`, cursor: 'ns-resize', extentFromRight: TRADE_EXTENT,
        leftLabel: `${o.side} ${o.qty} ${o.type}`, closeButton: true, // click the box to cancel
      }, 0);
    }
    function cancelOrder(id) { // id = "order:<n>"
      const o = orders.find((x) => `order:${x.id}` === id);
      if (!o) return;
      if (o.line && chart) chart.removePrimitive(o.line);
      orders = orders.filter((x) => x !== o);
      el('status').textContent = `cancelled ${o.side} ${o.type} @ ${fmt(o.price)}`;
      saveState();
    }
    function placeOrder(side, type, price) {
      const qty = Math.max(1, Number(el('qty').value) || 1);
      if (type === 'MARKET') { fillMarket(side, qty); return; } // executes into a position
      const o = { id: nextOrderId++, side, type, price: round2(price), qty, product: el('product').value };
      o.line = chart ? orderLine(o) : null;
      orders.push(o);
      el('status').textContent = `${side} ${type} ${qty} ${req.symbol} @ ${fmt(o.price)} (${o.product}) - drag the line to modify`;
      saveState();
    }
    function attachOrderLines() { for (const o of orders) o.line = orderLine(o); } // on chart rebuild
    function removeAllOrders() {
      if (chart) for (const o of orders) if (o.line) chart.removePrimitive(o.line);
      orders = [];
    }

    // Execute a market order at the last price -> update the net position, drop an
    // arrow marker on the bar, and (re)draw the position line.
    function fillMarket(side, qty) {
      if (!currentBars.length) return;
      const last = currentBars[currentBars.length - 1];
      const price = round2(last.close);
      const signed = side === 'BUY' ? qty : -qty;
      if (!position || position.netQty === 0) {
        position = { netQty: signed, avgPrice: price };
      } else if (Math.sign(position.netQty) === Math.sign(signed)) {
        const net = position.netQty + signed; // adding -> volume-weighted average
        position.avgPrice = (position.avgPrice * position.netQty + price * signed) / net;
        position.netQty = net;
      } else {
        const net = position.netQty + signed; // reducing / flipping
        position = net === 0 ? null
          : Math.sign(net) === Math.sign(position.netQty) ? { netQty: net, avgPrice: position.avgPrice }
          : { netQty: net, avgPrice: price };
      }
      fills.push({
        time: last.time, position: side === 'BUY' ? 'belowBar' : 'aboveBar',
        shape: side === 'BUY' ? 'arrowUp' : 'arrowDown', size: 'small',
        color: side === 'BUY' ? UP : DOWN, text: `${side[0]} ${qty}`,
      });
      if (markersApi) markersApi.setMarkers(fills);
      updatePositionLine();
      const p = position;
      el('status').textContent = p
        ? `${side} MARKET ${qty} filled @ ${fmt(price)} -> ${p.netQty > 0 ? 'LONG' : 'SHORT'} ${Math.abs(p.netQty)} @ ${fmt(p.avgPrice)}`
        : `${side} MARKET ${qty} filled @ ${fmt(price)} -> flat`;
      saveState();
    }
    // P&L of the open position marked at `mp` (defaults to the latest close).
    function markPrice() { return currentBars.length ? currentBars[currentBars.length - 1].close : 0; }
    function positionLabel(mp) {
      const long = position.netQty > 0;
      const pnl = (mp - position.avgPrice) * position.netQty;
      return `${long ? 'LONG' : 'SHORT'} ${Math.abs(position.netQty)} @ ${fmt(position.avgPrice)}  ${rupee(pnl)}`;
    }
    function updatePositionLine() {
      if (posLine && chart) { chart.removePrimitive(posLine); posLine = null; }
      if (!position || position.netQty === 0 || !chart) return;
      const long = position.netQty > 0;
      posLine = chart.addPriceLine({
        price: round2(position.avgPrice), color: long ? '#2e7d6b' : '#a14a52', lineWidth: 2, dashed: false,
        id: 'position', extentFromRight: TRADE_EXTENT, leftLabel: positionLabel(markPrice()), closeButton: true,
      }, 0);
    }
    function clearPosition() {
      if (posLine && chart) chart.removePrimitive(posLine);
      posLine = null; position = null; fills = [];
      if (markersApi) markersApi.setMarkers([]);
    }
    // Keep pills locked to price across pan / zoom / rescale / kinetic.
    (function frame() { positionPills(); requestAnimationFrame(frame); })();

    // Drag a pill vertically to modify its leg (entry pill moves the whole bracket).
    function dragify(id, which) {
      const node = el(id);
      node.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return; // let buttons handle their own clicks
        node.setPointerCapture(e.pointerId); node._drag = true; e.preventDefault();
      });
      node.addEventListener('pointermove', (e) => {
        if (!node._drag) return;
        const p = chart && chart.coordinateToPrice(e.clientY - chartTop(), 0);
        if (p != null) setBracketPrice(which, p);
      });
      const end = (e) => { node._drag = false; try { node.releasePointerCapture(e.pointerId); } catch (_) {} };
      node.addEventListener('pointerup', end);
      node.addEventListener('pointercancel', end);
    }
    dragify('bk-tp', 'tp'); dragify('bk-entry', 'entry'); dragify('bk-sl', 'sl');

    el('bracket').addEventListener('click', (e) => {
      const act = e.target.getAttribute && e.target.getAttribute('data-act');
      if (!act || !bracket) return;
      if (act === 'cancel') { removeBracket(); saveState(); el('status').textContent = 'bracket cancelled'; }
      else if (act === 'place') {
        el('status').textContent = `placed ${bracket.side} OCO bracket - ${bracket.qty} entry ${fmt(bracket.entry)} · TP ${fmt(bracket.target)} · SL ${fmt(bracket.stop)} (target/stop are OCO)`;
      } else if (act === 'modify') {
        const rr = (Math.abs(bracket.target - bracket.entry) / Math.max(1e-9, Math.abs(bracket.entry - bracket.stop))).toFixed(2);
        el('status').textContent = `bracket - entry ${fmt(bracket.entry)} · TP ${fmt(bracket.target)} · SL ${fmt(bracket.stop)} · R:R ${rr}`;
      }
    });

    // A primitive belongs to one pane and anchors to THAT pane's box, so a
    // bottom-left watermark on pane 0 floats mid-chart as soon as an indicator
    // pane appears beneath it. Re-home it on the bottom pane whenever the pane
    // stack changes, so it stays in the chart's own bottom-left corner.
    let watermark = null;
    function placeWatermark() {
      if (!chart) return;
      if (watermark) chart.removePrimitive(watermark);
      watermark = new LogoWatermark({
        // The symbol-only asset has a square viewBox tight to the mark, so
        // height alone gives 32x32; 3 of padding puts it in a 38x38 plate.
        src: '/examples/openalgo-glyph.svg', height: 32, opacity: 0.85,
        position: 'bottom-left', margin: 6, padding: 3,
        // Mark alone at rest; the wording unrolls to its right on hover. The
        // mark and text share one colour, so setting either sets both.
        label: 'OpenAlgo Charts',
        labelColor: '#e4e8f4',
        href: 'https://openalgo.in',
      });
      chart.addPrimitive(watermark, chart.panes().length - 1);
    }

    // ── indicator picker ───────────────────────────────────────────────────
    // The picker is built from the registry, not a hardcoded list — anything
    // registered (built-in or your own descriptor) shows up here automatically.
    function fillIndicatorPicker() {
      const pick = el('indpick');
      const byCat = new Map();
      for (const d of registeredIndicators().sort((a, b) => a.name.localeCompare(b.name))) {
        const cat = d.category || 'Other';
        if (!byCat.has(cat)) byCat.set(cat, []);
        byCat.get(cat).push(d);
      }
      pick.innerHTML = '';
      for (const [cat, list] of [...byCat].sort((a, b) => a[0].localeCompare(b[0]))) {
        const g = document.createElement('optgroup');
        g.label = cat;
        for (const d of list) {
          const o = document.createElement('option');
          o.value = d.id; o.textContent = d.name;
          g.appendChild(o);
        }
        pick.appendChild(g);
      }
      pick.value = 'macd';
    }

    // One chip per live instance, reading chart.indicators() — the same handles
    // an objects panel would drive.
    function renderIndicatorChips() {
      const host = el('indlist');
      host.innerHTML = '';
      for (const inst of chart.indicators()) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        const first = inst.series(Object.keys(inst.values())[0]);
        const color = (inst.settings().color) || '#8892a6';
        chip.innerHTML = `<span class="sw" style="background:${esc(String(color))}"></span><b>${esc(inst.name)}</b>`;
        const x = document.createElement('button');
        x.textContent = '×';
        x.title = 'remove';
        x.addEventListener('click', () => {
          chart.removeIndicator(inst.id);
          activeIndicators = activeIndicators.filter((s) => s.indicatorId !== inst.indicatorId);
          renderIndicatorChips();
          el('status').textContent = `removed ${inst.name}`;
        });
        chip.appendChild(x);
        host.appendChild(chip);
        void first;
      }
      if (!chart.indicators().length) host.innerHTML = '<span style="color:var(--faint);font-size:12px">none</span>';
    }

    // ── generated indicator settings ───────────────────────────────────────
    // Nothing here is indicator-specific: the descriptor's `inputs` declare a
    // key, a type, a label, and a default, which is everything a form needs.
    // The same 40 lines render MACD, Bollinger, or your own custom descriptor.
    let settingsFor = null; // the IndicatorApi handle being edited

    let settingsTab = 'inputs';
    function openSettings(instanceId) {
      const inst = chart.indicators().find((i) => i.id === instanceId);
      if (!inst) return;
      settingsFor = inst;
      el('set-title').textContent = getIndicator(inst.indicatorId).name + ' settings';
      renderSettingsTab();
      el('setmodal').hidden = false;
    }

    // Inputs = the descriptor's own `inputs`. Style = `indicatorStyleInputs()`,
    // generated per plot (colour, opacity, thickness, line style) so every
    // indicator gets the same controls without declaring them.
    function renderSettingsTab() {
      const inst = settingsFor;
      if (!inst) return;
      const descriptor = getIndicator(inst.indicatorId);
      const current = inst.settings();
      const inputs = settingsTab === 'style' ? indicatorStyleInputs(descriptor) : descriptor.inputs;
      const body = el('set-body');
      body.innerHTML = '';
      let group = null;
      for (const input of inputs) {
        if (input.group && input.group !== group) {
          group = input.group;
          const h = document.createElement('div');
          h.className = 'set-group';
          h.textContent = group;
          body.appendChild(h);
        }
        const row = document.createElement('div');
        row.className = 'set-row';
        const label = document.createElement('label');
        label.textContent = input.label;
        label.htmlFor = 'set_' + input.key;
        let field;
        if (input.type === 'select' || input.type === 'source') {
          field = document.createElement('select');
          const options = input.type === 'source' ? INDICATOR_SOURCES : input.options;
          for (const o of options) {
            const opt = document.createElement('option');
            opt.value = o.value; opt.textContent = o.label;
            field.appendChild(opt);
          }
          field.value = String(current[input.key]);
        } else if (input.type === 'boolean') {
          field = document.createElement('input');
          field.type = 'checkbox';
          field.checked = Boolean(current[input.key]);
        } else {
          field = document.createElement('input');
          field.type = input.type === 'number' ? 'number' : input.type === 'color' ? 'color' : 'text';
          if (input.type === 'number') {
            if (input.min !== undefined) field.min = input.min;
            if (input.max !== undefined) field.max = input.max;
            if (input.step !== undefined) field.step = input.step;
          }
          field.value = String(current[input.key] ?? '');
        }
        field.id = 'set_' + input.key;
        field.dataset.key = input.key;
        field.dataset.kind = input.type;
        row.append(label, field);
        body.appendChild(row);
      }
    }

    function collectSettings() {
      if (!settingsFor) return;
      const patch = {};
      for (const field of el('set-body').querySelectorAll('[data-key]')) {
        const { key, kind } = field.dataset;
        patch[key] = kind === 'number' ? Number(field.value)
          : kind === 'boolean' ? field.checked
          : field.value;
      }
      settingsFor.setSettings(patch);                       // recomputes + restyles
      const spec = activeIndicators.find((s) => s.indicatorId === settingsFor.indicatorId);
      if (spec) spec.settings = settingsFor.settings();      // survives a chart rebuild
    }

    function applySettings() {
      if (!settingsFor) return;
      const name = settingsFor.name;
      collectSettings();
      renderIndicatorChips();
      el('status').textContent = `${name} updated`;
      closeSettings();
    }

    function closeSettings() {
      el('setmodal').hidden = true;
      settingsFor = null;
      settingsTab = 'inputs';
      for (const t of document.querySelectorAll('.set-tab')) t.classList.toggle('is-on', t.dataset.tab === 'inputs');
    }

    // (Re)build the chart for the currently selected type using cached bars.
    function render() {
      if (chart) chart.destroy();
      el('chart').innerHTML = '';
      chart = createChart(el('chart'), {
        // DEFAULT_THEME is the light palette, so a dark shell needs to ask.
        theme: darkTheme,
        priceAxisWidth: 72, // free crosshair (follows pointer)
        grid: { vertLines: el('vgrid').checked, horzLines: el('hgrid').checked },
      });

      // Row 0 of the price pane: symbol + interval + the O/H/L/C/V readout.
      // Added BEFORE any indicator so their legends stack beneath it
      // (`legendRowsOn` counts what is already there).
      symbolLegend = new PaneLegend({ id: 'symbol', title: '', params: '', row: 0, actions: [] });
      chart.addPrimitive(symbolLegend, 0);

      const sel = el('ctype').value;
      const isTransform = sel.startsWith('t:');
      el('pfmode').hidden = sel !== 't:point-figure';

      // Family-B transforms replace the plotted series with derived elements, so
      // the volume pane and trading overlay are hidden for them (a Renko brick or
      // a P&F column has no single source bar to hang volume off).
      const { type, data } = isTransform
        ? applyTransform(sel.slice(2), currentBars)
        : { type: sel, data: currentBars };

      const style = {};
      if (type === 'baseline') {
        const avg = currentBars.reduce((s, b) => s + b.close, 0) / (currentBars.length || 1);
        style.baseValue = avg;
      }
      price = chart.addSeries(type, { style }); // first series -> drives the OHLC legend
      price.setData(data);
      if (!isTransform) {
        // Volume rides an OVERLAY price scale inside the price pane
        // (priceScaleId: '') rather than a pane of its own: it autoscales
        // independently but draws no axis, so the right-hand column stays a
        // clean price ladder instead of stacking a second numeric scale. The
        // 82% top margin pins the bars to the bottom fifth, and the `volume`
        // price format renders 200M rather than 200000000.
        volume = chart.addSeries('histogram', {
          paneIndex: 0,
          priceScaleId: '',
          style: { color: '#33415e', base: 0 },
          priceFormat: { type: 'volume' },
        });
        volume.priceScale().setOptions({ marginTop: 0.82, marginBottom: 0 });
        volume.setData(currentBars.map((b) => ({ time: b.time, open: 0, high: b.volume, low: 0, close: b.volume })));
        volLegend = new PaneLegend({ id: 'volume', title: 'Vol', params: '', actions: [] });
        chart.addPrimitive(volLegend, 0);
        markersApi = price.createMarkers(); // executed-fill arrows
        markersApi.setMarkers(fills);
      } else {
        volume = null;
        markersApi = null; // the old handle belongs to the destroyed chart
        volLegend = null;  // transforms have no per-bar volume to report
      }

      // Indicators come from the lazy 'openalgo-charts/indicators' tier. The chart
      // owns the whole lifecycle: it creates one series per plot, picks the pane,
      // draws declared reference levels (RSI 70/30), pins a declared fixed range
      // (RSI 0..100), and recomputes on every data change.
      if (!isTransform) {
        for (const spec of activeIndicators) {
          try { chart.addIndicator(spec.indicatorId, spec.settings); }
          catch (e) { console.warn('indicator', spec.indicatorId, e.message); }
        }
      }
      renderIndicatorChips();
      placeWatermark();
      attachDrawing();

      // Chart trading: one drag handler routes both - drag a bracket leg -> move
      // that leg; drag a resting order line -> re-price that order. Both are redrawn
      // on the freshly-rebuilt chart.
      chart.subscribeDrag((externalId, p) => {
        if (externalId.startsWith('bk-')) { setBracketPrice(externalId.slice(3), p); return; }
        if (externalId.startsWith('order:')) {
          const o = orders.find((x) => `order:${x.id}` === externalId);
          if (o && o.line) { o.price = round2(p); o.line.setPrice(o.price); el('status').textContent = `${o.side} ${o.type} order -> ${fmt(o.price)}`; saveState(); }
        }
      });
      // Click the cancel box on a line: cancel that order, or close the position.
      chart.subscribeClick((id) => {
        // The canvas cannot hold an anchor, so the mark reports the hit and we
        // do the navigating. noopener: the opened tab must not reach back.
        if (id === 'watermark') {
          const href = watermark && watermark.href();
          if (href) window.open(href, '_blank', 'noopener,noreferrer');
          return;
        }
        if (id === 'position::close') { clearPosition(); saveState(); el('status').textContent = 'position closed'; return; }
        if (id.endsWith('::close')) cancelOrder(id.slice(0, -'::close'.length));
      });
      attachOrderLines();
      updatePositionLine(); // redraw the position line on the rebuilt chart
      if (bracket) {
        el('bracket').hidden = false;
        el('bk-entry').querySelector('[data-act="place"]').className = bracket.side === 'BUY' ? 'bk-buy' : 'bk-sell';
        attachBracketLines(); updateBracket();
      }

      // The gear on a pane legend has no built-in dialog (the engine ships no
      // DOM), so it emits and we render the generated form.
      chart.on('indicatorSettings', ({ instanceId }) => openSettings(instanceId));
      // The ✕ / trash on a legend removes the indicator inside the chart, so
      // mirror that into our own spec list and refresh the chips.
      chart.on('indicatorRemoved', ({ indicatorId }) => {
        activeIndicators = activeIndicators.filter((s) => s.indicatorId !== indicatorId);
        renderIndicatorChips();
      });
      // Any change to the pane stack moves which pane is the bottom one.
      for (const ev of ['paneRemoved', 'paneMoved']) chart.on(ev, placeWatermark);

      // OHLC legend tracks the crosshair. The position P&L does NOT - it marks to
      // the LTP (the latest close here; with a live feed, update it on each tick).
      chart.subscribeCrosshairMove((e) => setLegend(e.bar ?? currentBars[currentBars.length - 1]));
      setLegend(currentBars[currentBars.length - 1]);
      window.__chart = () => chart;
      window.__draw = () => draw;
    }

    async function load() {
      const status = el('status');
      // Clamp here too, not just at the interval buttons: a saved layout or a
      // hand-set select can otherwise ask for a range the interval cannot serve.
      const interval = el('interval').value;
      const wanted = el('period').value;
      const period = clampPeriod(interval, wanted);
      if (period !== wanted) el('period').value = period;
      req = { symbol: el('symbol').value.trim(), interval, period };
      status.textContent = `loading ${req.symbol} ${req.interval}...`;
      try {
        const bars = await feed.getBars(req);
        currentBars = bars;
        idxByTime.clear();
        bars.forEach((b, i) => idxByTime.set(b.time, i));
        removeBracket(); removeAllOrders(); clearPosition(); // detach old chart's lines + reset vars
        restoreState(req.symbol);                            // repopulate this symbol's saved orders/bracket/position
        render();
        // Re-apply the saved layout now the series exists — a logical viewport
        // means nothing on an empty chart, and the drawing controller reads its
        // model back out of the restored state.
        try {
          const raw = localStorage.getItem(LAYOUT_KEY);
          if (raw) {
            const saved = JSON.parse(raw);
            activeIndicators = (saved.indicators || []).map((i) => ({ indicatorId: i.indicatorId, settings: i.settings }));
            chart.restoreState(saved);
            if (draw) draw.fromJSON(saved.drawings || []);
            renderIndicatorChips();
            placeWatermark();
          }
        } catch (e) {
          // A silent catch here hid a real restore failure once; say so.
          console.warn('[demo] layout restore failed:', e);
        }
        status.textContent = `${req.symbol} · ${bars.length} bars · ${req.interval}/${req.period}`
          + (period !== wanted ? `  (${wanted} unavailable at ${interval})` : '');
      } catch (e) {
        status.textContent = 'error: ' + e.message;
      }
    }

    el('buy').addEventListener('click', () => makeBracket('BUY'));
    el('sell').addEventListener('click', () => makeBracket('SELL'));
    el('cancel').addEventListener('click', () => { removeBracket(); removeAllOrders(); clearPosition(); saveState(); el('status').textContent = 'cancelled / flat'; });
    el('qty').addEventListener('change', () => { if (bracket) { bracket.qty = Math.max(1, Number(el('qty').value) || 1); updateBracket(); saveState(); } });

    // ── broker-style right-click order entry ───────────────────────────
    // Right-click the chart to open a menu and place an order at the cursor price.
    // LIMIT/SL orders appear as draggable working-order lines; MARKET fills now.
    const ctxMenu = el('ctxmenu');
    let ctxPrice = 0;
    const hideCtx = () => { ctxMenu.hidden = true; };
    el('chart').addEventListener('contextmenu', (e) => {
      const p = chart && currentBars.length ? chart.coordinateToPrice(e.clientY - chartTop(), 0) : null;
      if (p == null) return;
      e.preventDefault();
      ctxPrice = round2(p);
      ctxMenu.querySelectorAll('button[data-type]').forEach((b) => {
        const verb = b.getAttribute('data-side') === 'BUY' ? 'Buy' : 'Sell';
        const type = b.getAttribute('data-type');
        b.textContent = type === 'MARKET' ? `${verb} Market`
          : type === 'LIMIT' ? `${verb} Limit @ ${fmt(ctxPrice)}`
          : `${verb} Stop (SL) @ ${fmt(ctxPrice)}`;
      });
      // Hide the drawing rows when there is nothing to act on, so the menu
      // never offers a dead option.
      const nDraw = draw ? draw.drawings().length : 0;
      const selId = draw ? draw.selected() : null;
      const rowAll = ctxMenu.querySelector('[data-act="delall"]');
      const rowSel = ctxMenu.querySelector('[data-act="delsel"]');
      rowAll.hidden = nDraw === 0;
      rowSel.hidden = !selId;
      rowAll.previousElementSibling.hidden = nDraw === 0;   // its separator
      if (nDraw > 0) rowAll.textContent = `Remove All Drawings (${nDraw})`;

      ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
      ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 230) + 'px';
      ctxMenu.hidden = false;
    });
    window.addEventListener('click', hideCtx);
    window.addEventListener('blur', hideCtx);
    el('chart').addEventListener('wheel', hideCtx, { passive: true });
    ctxMenu.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      e.stopPropagation();
      hideCtx();
      const act = btn.getAttribute('data-act');
      if (act === 'cancelall') {
        removeAllOrders(); removeBracket(); clearPosition(); saveState(); el('status').textContent = 'all orders cancelled / flat'; return;
      }
      if (act === 'delall') {
        if (!draw) return;
        const n = draw.drawings().length;
        draw.clear();                 // one undo step, so it is recoverable
        autosave();
        el('status').textContent = n ? `removed ${n} drawing${n === 1 ? '' : 's'}` : 'no drawings to remove';
        return;
      }
      if (act === 'delsel') {
        if (!draw) return;
        const id = draw.selected();
        if (id) { draw.remove(id); autosave(); el('status').textContent = 'drawing deleted'; }
        return;
      }
      placeOrder(btn.getAttribute('data-side'), btn.getAttribute('data-type'), ctxPrice);
    });

    el('load').addEventListener('click', load);
    el('fit').addEventListener('click', () => { if (chart) chart.resetScale(); });
    el('symbol').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
    // Export the full chart (all layers composited) - native right-click "Save image"
    // only grabs the canvas under the pointer (the transparent crosshair overlay).
    el('save').addEventListener('click', () => {
      if (!chart) return;
      const a = document.createElement('a');
      a.download = `${nameOf(req.symbol || 'chart')}_${(req.interval || '').toLowerCase()}.png`;
      a.href = chart.takeScreenshot().toDataURL('image/png');
      a.click();
    });
    // switching chart type / P&F box mode re-renders cached bars (no network round-trip)
    ['ctype', 'pfmode'].forEach((id) => el(id).addEventListener('change', () => { if (currentBars.length) render(); }));
    // toggle grid lines live (no rebuild needed)
    const applyGrid = () => chart && chart.setGridOptions({ vertLines: el('vgrid').checked, horzLines: el('hgrid').checked });
    el('vgrid').addEventListener('change', applyGrid);
    el('hgrid').addEventListener('change', applyGrid);

    // Add an indicator live — no chart rebuild, no refetch. The handle it returns
    // is what a settings dialog or an objects panel would drive.
    el('indadd').addEventListener('click', () => {
      const id = el('indpick').value;
      if (!chart || !currentBars.length) return;
      if (activeIndicators.some((s) => s.indicatorId === id)) { el('status').textContent = `${id} already added`; return; }
      const inst = chart.addIndicator(id);
      activeIndicators.push({ indicatorId: id, settings: inst.settings() });
      renderIndicatorChips();
      placeWatermark(); // a new pane may now be the bottom one
      autosave();
      el('status').textContent = `added ${inst.name} on pane ${inst.paneIndex}`;
    });

    // ── layout persistence ─────────────────────────────────────────────────
    // getState() captures the viewport, grid, panes, price scales and indicator
    // instances. It deliberately does NOT capture series data — that is the
    // app's (it knows the symbol and feed) — so restore reports the series
    // descriptors back and we rebuild them from the cached bars.
    el('lsave').addEventListener('click', () => {
      if (!chart) return;
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(chart.getState()));
      el('status').textContent = `layout saved · ${chart.indicators().length} indicator(s)`;
    });
    el('lload').addEventListener('click', () => {
      const raw = localStorage.getItem(LAYOUT_KEY);
      if (!chart || !raw) { el('status').textContent = 'no saved layout'; return; }
      const state = JSON.parse(raw);
      // Mirror the restored indicators into our own spec list so a later chart
      // rebuild (type switch / reload) keeps them.
      activeIndicators = (state.indicators || []).map((i) => ({ indicatorId: i.indicatorId, settings: i.settings }));
      const report = chart.restoreState(state);
      if (!report.applied) { el('status').textContent = 'restore failed: ' + report.reason; return; }
      renderIndicatorChips();
      el('status').textContent = `layout restored · ${report.indicators} indicator(s) · ${report.series.length} series descriptor(s)`;
    });

    for (const tab of document.querySelectorAll('.set-tab')) {
      tab.addEventListener('click', () => {
        if (!settingsFor) return;
        collectSettings();                       // keep edits made on this tab
        settingsTab = tab.dataset.tab;
        for (const t of document.querySelectorAll('.set-tab')) t.classList.toggle('is-on', t === tab);
        renderSettingsTab();
      });
    }
    el('set-ok').addEventListener('click', applySettings);

    const INTERVALS = ['5m', '15m', '30m', '1h', '1d', '1wk'];
    const PERIODS = ['1mo', '6mo', '1y', '5y', 'max'];

    /* Yahoo caps how far back intraday data goes, and answers an over-long
       request with an *empty* frame rather than an error — so 5m/15m/30m with
       the default 1y range silently drew nothing while 1h and 1d worked. Clamp
       the range to what the interval can actually serve. */
    const PERIOD_DAYS = { '1mo': 31, '6mo': 186, '1y': 366, '5y': 1830, max: 1e6 };
    const INTERVAL_MAX_DAYS = { '1m': 7, '2m': 60, '5m': 60, '15m': 60, '30m': 60, '90m': 60, '1h': 730 };
    /** Periods this interval can serve, longest last. Daily and up: all of them. */
    function periodsFor(interval) {
      const cap = INTERVAL_MAX_DAYS[interval];
      return cap === undefined ? PERIODS.slice() : PERIODS.filter((p) => PERIOD_DAYS[p] <= cap);
    }
    /** `wanted` if the interval can serve it, else the longest range it can. */
    function clampPeriod(interval, wanted) {
      const ok = periodsFor(interval);
      if (ok.includes(wanted)) return wanted;
      return ok[ok.length - 1] || PERIODS[0];
    }

    /** One popup menu at a time, anchored under its button. */
    let openMenu = null;
    function popupMenu(anchor, rows) {
      closeMenu();
      const m = document.createElement('div');
      m.className = 'menu';
      for (const r of rows) {
        if (r.group) {
          const g = document.createElement('div');
          g.className = 'menu-group';
          g.textContent = r.group;
          m.appendChild(g);
          continue;
        }
        const b = document.createElement('button');
        b.innerHTML = (r.icon ? ticon(r.icon) : '<span style="width:20px"></span>') +
          '<span>' + esc(r.label) + '</span>' + (r.on ? '<em>&#10003;</em>' : '');
        b.addEventListener('click', () => { closeMenu(); r.onSelect(); });
        m.appendChild(b);
      }
      document.body.appendChild(m);
      const r = anchor.getBoundingClientRect();
      m.style.left = Math.min(r.left, window.innerWidth - m.offsetWidth - 8) + 'px';
      m.style.top = (r.bottom + 4) + 'px';
      openMenu = m;
    }
    function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }

       Full-screens the stage (rail + chart + legend) rather than the page, so
       the toolbar and the hint strip drop away and the plot gets the whole
       display. The chart's own ResizeObserver picks up the new box, so there is
       nothing to re-measure by hand. */
    const stageEl = () => document.querySelector('main.stage');
    const isChartFull = () => document.fullscreenElement === stageEl();

    function toggleChartFullscreen() {
      const stage = stageEl();
      if (!stage) return;
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (stage.requestFullscreen) {
        // Fullscreen is user-gesture gated and blocked outright in some embeds.
        stage.requestFullscreen().catch((e) => {
          el('status').textContent = 'full screen unavailable: ' + (e && e.message ? e.message : e);
        });
      } else {
        el('status').textContent = 'full screen not supported by this browser';
      }
    }

    // The toolbar goes with the page, so the only way back would be Esc. Put a
    // matching exit chip inside the stage, which is the part still on screen.
    function syncFullscreenChrome() {
      const stage = stageEl();
      if (!stage) return;
      let chip = el('fsexit');
      if (isChartFull()) {
        if (!chip) {
          chip = document.createElement('button');
          chip.id = 'fsexit';
          chip.className = 'fsexit';
          chip.title = 'Exit full screen (Esc)';
          chip.innerHTML = ticon('fullscreenExit');
          chip.addEventListener('click', toggleChartFullscreen);
          stage.appendChild(chip);
        }
      } else if (chip) {
        chip.remove();
      }
    }

      // null, and load()'s first line is a write to it, so changing symbol /

      // it if an earlier render already ate it.
      const statusText = el('status') || Object.assign(document.createElement('span'), { id: 'status' });
      if (statusText.parentElement) statusText.parentElement.removeChild(statusText);

      // range menu

      range.addEventListener('click', () => popupMenu(range, periodsFor(el('interval').value).map((p) => ({

      // chart type menu

      ct.addEventListener('click', () => popupMenu(ct, CHART_TYPES.map((t) => (t.group ? { group: t.group } : {

          { label: 'Horizontal', on: !v.checked && h.checked, onSelect: () => { v.checked = false; h.checked = true; v.dispatchEvent(new Event('change')); h.dispatchEvent(new Event('change')); } },
          { label: 'Vertical', on: v.checked && !h.checked, onSelect: () => { v.checked = true; h.checked = false; v.dispatchEvent(new Event('change')); h.dispatchEvent(new Event('change')); } },
          { label: 'None', on: !v.checked && !h.checked, onSelect: () => { v.checked = h.checked = false; v.dispatchEvent(new Event('change')); h.dispatchEvent(new Event('change')); } },
        ]);
      }));
      const mg = iconBtn('magnet', 'Magnet: snap drawings to O/H/L/C', () => {
        const box = el('magnet');
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));

      bar.appendChild(iconBtn('camera', 'Save PNG', () => el('save').click()));

      bar.appendChild(iconBtn('restore', 'Restore layout', () => el('lload').click()));

      status.className = 'status';
      status.innerHTML = '<span class="status-dot"></span>';
      status.appendChild(statusText);
      bar.appendChild(status);
    }

        { head: 'Brushes' },
        { tool: 'brush', name: 'Brush', icon: 'brush' },
