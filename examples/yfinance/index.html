      ] },
      { sep: true },
      { icon: 'trash', title: 'Remove all drawings', action: 'clear' },
    ];

    let railMenu = null;   // the open flyout, if any

    function closeRailMenu() {
      if (railMenu) { railMenu.remove(); railMenu = null; }
    }

    /** Flyout listing a group's tools, anchored beside its rail button. */
    function openRailMenu(group, btn) {
      closeRailMenu();
      const m = document.createElement('div');
      m.className = 'railmenu';
      for (const it of group.menu) {
        if (it.head) {
          const h = document.createElement('div');
          h.className = 'railmenu__head';
          h.textContent = it.head;
          m.appendChild(h);
          continue;
        }
        const row = document.createElement('button');
        row.className = 'railmenu__item';
        const chord = SHORTCUTS[it.tool];
        row.innerHTML =
          svgIcon(it.icon) + '<span>' + it.name + '</span>' +
          (chord ? '<span class="chord">' + chord.replace('+', ' + ') + '</span>' : '');
        if (draw && draw.activeTool() === it.tool) row.classList.add('is-on');
        row.addEventListener('click', (e) => {
          e.stopPropagation();
          group.last = it.tool;            // the button re-activates this next time
          btn.innerHTML = svgIcon(it.icon) + caretEl();
          closeRailMenu();
          if (draw) draw.setTool(it.tool);
        });
        m.appendChild(row);
      }
      document.body.appendChild(m);
      // Anchor to the button, then nudge up so it never runs off the bottom.
      const r = btn.getBoundingClientRect();
      m.style.left = (r.right + 6) + 'px';
      const top = Math.min(r.top, window.innerHeight - m.offsetHeight - 8);
      m.style.top = Math.max(8, top) + 'px';
      railMenu = m;
    }

    const caretEl = () => '<i class="railcaret">' + svgIcon('wedge') + '</i>';
    /** Hover label; `chord` is the tool's keyboard shortcut when it has one. */
    const tipEl = (text, chord) =>
      '<i class="railtip">' + esc(text) + (chord ? '<b>' + esc(chord) + '</b>' : '') + '</i>';
    /** Tool id -> chord, from the draw tier. */
    let SHORTCUTS = {};

    function buildRail() {
      const rail = el('rail');
      rail.innerHTML = '';
      for (const g of RAIL) {
        if (g.sep) {
          const sp = document.createElement('div');
          sp.className = 'sep';
          rail.appendChild(sp);
          continue;
        }
        const b = document.createElement('button');
        const tools = g.menu ? g.menu.filter((i) => i.tool).map((i) => i.tool) : (g.tools || []);
        if (g.menu) g.last = g.last || tools[0];
        const ownChord = !g.menu && tools.length === 1 ? SHORTCUTS[tools[0]] : undefined;
        b.innerHTML =
          svgIcon(g.icon) + (g.menu ? caretEl() : '') + tipEl(g.title, ownChord);
        b.setAttribute('aria-label', g.title);
        b.dataset.tools = tools.join(',');
        b.addEventListener('click', (e) => {
          if (!draw) return;
          if (g.action === 'clear') { draw.clear(); return; }
          closeRailMenu();
          if (!g.menu) {
            if (tools.length === 0) { draw.setTool(null); return; }
            const at = tools.indexOf(draw.activeTool());
            draw.setTool(tools[(at + 1) % tools.length]);
            return;
          }
          // Clicking the caret opens the list; anywhere else activates the last
          // tool picked, so the common case stays a single click.
          const r = b.getBoundingClientRect();
          if (e.clientX >= r.right - 13 || draw.activeTool() === g.last) openRailMenu(g, b);
          else draw.setTool(g.last);
        });
        rail.appendChild(b);
      }
    }

    document.addEventListener('click', (e) => {
      if (railMenu && !railMenu.contains(e.target) && !e.target.closest('.rail button')) closeRailMenu();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeRailMenu(); });

    function syncRail(tool) {
      for (const b of el('rail').querySelectorAll('button')) {
        const tools = (b.dataset.tools || '').split(',').filter(Boolean);
        b.classList.toggle('is-on', tool === null ? tools.length === 0 : tools.indexOf(tool) >= 0);
      }
      el('drawtool').value = tool || '';
    }

    // ── the floating tool widget ───────────────────────────────────────────
    const SWATCHES = [
      '#ffffff', '#d1d4dc', '#b2b5be', '#9598a1', '#787b86', '#5d606b', '#434651', '#2a2e39', '#1e222d', '#000000',
      '#f23645', '#ff9800', '#ffe100', '#4caf50', '#089981', '#00bcd4', '#2962ff', '#673ab7', '#9c27b0', '#e91e63',
      '#fccbcd', '#ffe0b2', '#fff9c4', '#c8e6c9', '#b2dfdb', '#b2ebf2', '#bbdefb', '#d1c4e9', '#e1bee7', '#f8bbd0',
      '#faa1a4', '#ffcc80', '#fff176', '#a5d6a7', '#80cbc4', '#80deea', '#90caf9', '#b39ddb', '#ce93d8', '#f48fb1',
      '#f77c80', '#ffb74d', '#ffee58', '#81c784', '#4db6ac', '#4dd0e1', '#64b5f6', '#9575cd', '#ba68c8', '#f06292',
      '#b22833', '#e65100', '#fbc02d', '#388e3c', '#00695c', '#0097a7', '#1565c0', '#4527a0', '#6a1b9a', '#ad1457',
    ];
    let widgetFor = null;   // id of the drawing the widget edits
    let widgetPos = null;   // set once the user drags the widget

    const drawingOf = (id) => (draw ? draw.get(id) : undefined);

    function showWidget(id) {
      const d = drawingOf(id);
      const w = el('toolwidget');
      if (!d) { w.hidden = true; widgetFor = null; hideColorPop(); return; }
      widgetFor = id;
      const style = d.style || {};
      const isText = d.tool === 'text';
      w.innerHTML = '';

      const grip = document.createElement('span');
      grip.className = 'grip';
      grip.textContent = '⠿';
      grip.title = 'Drag to move';
      w.appendChild(grip);
      startWidgetDrag(grip);

      const button = (html, title, onClick, cls) => {
        const b = document.createElement('button');
        b.innerHTML = html;
        b.title = title;
        if (cls) b.className = cls;
        if (onClick) b.addEventListener('click', onClick);
        w.appendChild(b);
        return b;
      };

      // Colour swatch opens the grid + opacity popover.
      const sw = document.createElement('button');
      sw.title = 'Colour and opacity';
      sw.innerHTML = '<span class="swatch" style="background:' + esc(style.color || '#2962ff') + '"></span>';
      sw.addEventListener('click', (e) => { e.stopPropagation(); toggleColorPop(); });
      w.appendChild(sw);

      if (isText) {
        const sizes = [10, 12, 13, 16, 20, 28, 40];
        const fs = document.createElement('button');
        fs.className = 'wbtn';
        fs.title = 'Font size';
        fs.textContent = String(style.fontSize || 13);
        fs.addEventListener('click', () => {
          const next = sizes[(sizes.indexOf(style.fontSize || 13) + 1) % sizes.length];
          draw.update(id, { style: { fontSize: next } });
          showWidget(id);
        });
        w.appendChild(fs);
        button(svgIcon('text'), 'Text settings', () => openTextDialog(id));
      } else {
        const steps = [1, 1.5, 2, 3, 4];
        const th = document.createElement('button');
        th.className = 'wbtn';
        th.title = 'Thickness';
        th.textContent = (style.lineWidth || 1.5) + 'px';
        th.addEventListener('click', () => {
          const next = steps[(steps.indexOf(style.lineWidth || 1.5) + 1) % steps.length];
          draw.update(id, { style: { lineWidth: next } });
          showWidget(id);
        });
        w.appendChild(th);

        const order = ['solid', 'dashed', 'dotted'];
        const cur = style.lineStyle || 'solid';
        const ls = document.createElement('button');
        ls.className = 'wbtn';
        ls.title = 'Line style';
        ls.textContent = cur === 'solid' ? '——' : cur === 'dashed' ? '- -' : '···';
        ls.addEventListener('click', () => {
          draw.update(id, { style: { lineStyle: order[(order.indexOf(cur) + 1) % 3] } });
          showWidget(id);
        });
        w.appendChild(ls);
      }

      const vs = document.createElement('span');
      vs.className = 'vsep';
      w.appendChild(vs);

      // Shapes can carry a label too — same dialog, shape-aware fields.
      if (!isText) button(svgIcon('text'), style.text ? 'Edit text' : 'Add text', () => openTextDialog(id));
      button(svgIcon(d.locked ? 'lock' : 'unlock'), d.locked ? 'Unlock' : 'Lock', () => {
        draw.update(id, { locked: !d.locked });
        showWidget(id);
      });
      button(svgIcon('clone'), 'Duplicate', () => {
        const copy = draw.add({
          tool: d.tool,
          paneIndex: d.paneIndex,
          style: Object.assign({}, d.style),
          points: d.points.map((p) => ({ time: p.time, price: p.price })),
        });
        draw.select(copy.id);
      });
      button(svgIcon('trash'), 'Delete (Del)', () => { draw.remove(id); }, 'danger');

      w.hidden = false;
      positionWidget();
    }

    /**
     * Inline text editing: an input floated over the drawing's anchor. A
     * `prompt()` is blockable, steals focus, and cannot be styled — and the
     * engine draws text on canvas, so there is no DOM node to contentEdit.
     */
    function editText(id) {
      const d = drawingOf(id);
      if (!d) return;
      const stage = el('chart');
      const p = d.points[0];
      const x = chart.timeToCoordinate(p.time);
      const y = chart.priceToCoordinate(p.price, d.paneIndex);
      const input = document.createElement('input');
      input.type = 'text';
      input.value = d.style.text || '';
      input.className = 'textedit';
      input.style.left = Math.max(46, (Number.isFinite(x) ? x : 60)) + 'px';
      input.style.top = ((y == null || !Number.isFinite(y) ? 60 : y) - 12) + 'px';
      input.style.fontSize = (d.style.fontSize || 13) + 'px';
      input.style.color = d.style.color || '#d7dce8';
      stage.parentElement.appendChild(input);
      input.focus();
      input.select();
      const commit = (save) => {
        if (save) draw.update(id, { style: { text: input.value } });
        input.remove();
        showWidget(id);
      };
      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') commit(true);
        else if (e.key === 'Escape') commit(false);
      });
      input.addEventListener('blur', () => commit(true));
    }


    // ── text settings dialog ───────────────────────────────────────────────
    // The engine draws text on canvas, so there is no DOM node to style — the
    // dialog edits the drawing's style bag and the renderer picks it up.
    const FONTS = [
      { label: 'Default', value: '' },
      { label: 'Sans', value: 'ui-sans-serif, system-ui, sans-serif' },
      { label: 'Serif', value: 'ui-serif, Georgia, serif' },
      { label: 'Mono', value: 'ui-monospace, SFMono-Regular, Menlo, monospace' },
    ];
    const FONT_SIZES = [10, 11, 12, 14, 16, 20, 24, 28, 32, 40, 48];
    let textDlgFor = null;

    function openTextDialog(id) {
      const d = drawingOf(id);
      if (!d) return;
      textDlgFor = id;
      const st = d.style || {};
      const dlg = el('textdlg');
      const isShape = d.tool !== 'text';
      const toolName = (BUILTIN_DRAWING_TOOLS.find((t) => t.id === d.tool) || { name: 'Text' }).name;
      dlg.innerHTML =
        '<div class="set-head"><span>' + esc(toolName) + '</span><button id="td-x" title="Close">&times;</button></div>' +
        '<div class="td-body">' +
          '<div class="td-row">' +
            '<input type="color" id="td-color" value="' + esc((d.tool !== 'text' ? st.fontColor : st.color) || st.color || '#d7dce8') + '" title="Font colour" />' +
            '<select id="td-font" title="Font"></select>' +
            '<select id="td-size" title="Size"></select>' +
            '<button id="td-bold" class="td-tog" title="Bold"><b>B</b></button>' +
            '<button id="td-italic" class="td-tog" title="Italic"><i>I</i></button>' +
          '</div>' +
          '<textarea id="td-text" rows="5" spellcheck="false"></textarea>' +
          '<label class="td-check"><input type="checkbox" id="td-bg" /> <span>Background</span>' +
            '<input type="color" id="td-bgc" title="Background colour" /></label>' +
          '<label class="td-check"><input type="checkbox" id="td-bd" /> <span>Border</span>' +
            '<input type="color" id="td-bdc" title="Border colour" /></label>' +
          '<label class="td-check"><input type="checkbox" id="td-wrap" /> <span>Text wrap</span>' +
            '<input type="number" id="td-wrapw" min="60" max="900" step="10" title="Wrap width (px)" /></label>' +
          // Shapes place their label relative to the outline, so they get the
          // Inside/Outside + Left/Centre/Right pair such panels show.
          (isShape
            ? '<div class="td-row"><span style="flex:1 1 auto;color:var(--mut);font-size:12px">Text alignment</span>' +
              '<select id="td-pos"><option value="inside">Inside</option><option value="outside">Outside</option></select>' +
              '<select id="td-align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>' +
              '</div>'
            : '') +
        '</div>' +
        '<div class="set-foot">' +
          '<button id="td-cancel" class="btn btn--ghost">Cancel</button>' +
          '<button id="td-ok" class="btn btn--primary">Ok</button>' +
        '</div>';

      const fontSel = el('td-font');
      for (const f of FONTS) {
        const o = document.createElement('option');
        o.value = f.value; o.textContent = f.label;
        fontSel.appendChild(o);
      }
      fontSel.value = st.fontFamily || '';

      const sizeSel = el('td-size');
      for (const s of FONT_SIZES) {
        const o = document.createElement('option');
        o.value = String(s); o.textContent = String(s);
        sizeSel.appendChild(o);
      }
      sizeSel.value = String(st.fontSize || 14);

      el('td-text').value = st.text || '';
      el('td-bold').classList.toggle('is-on', st.fontWeight === 'bold');
      el('td-italic').classList.toggle('is-on', st.fontStyle === 'italic');
      el('td-bg').checked = st.background === true;
      el('td-bgc').value = st.backgroundColor || '#1e222d';
      el('td-bd').checked = st.border === true;
      el('td-bdc').value = st.borderColor || (st.color || '#d7dce8');
      el('td-wrap').checked = st.wrap === true;
      el('td-wrapw').value = String(st.wrapWidth || 220);
      if (isShape) {
        el('td-pos').value = st.textPosition || 'inside';
        el('td-align').value = st.textAlign || 'left';
      }

      // Live preview: every control applies immediately, Cancel reverts.
      const before = Object.assign({}, st);
      const apply = () => {
        draw.update(textDlgFor, {
          style: {
            ...(isShape ? {} : { color: el('td-color').value }),
            fontFamily: el('td-font').value || undefined,
            fontSize: Number(el('td-size').value),
            fontWeight: el('td-bold').classList.contains('is-on') ? 'bold' : 'normal',
            fontStyle: el('td-italic').classList.contains('is-on') ? 'italic' : 'normal',
            text: el('td-text').value,
            background: el('td-bg').checked,
            backgroundColor: el('td-bgc').value,
            border: el('td-bd').checked,
            borderColor: el('td-bdc').value,
            wrap: el('td-wrap').checked,
            wrapWidth: Number(el('td-wrapw').value),
            // Shapes keep the outline colour on `color`; the label uses fontColor.
            ...(isShape
              ? { fontColor: el('td-color').value, textPosition: el('td-pos').value, textAlign: el('td-align').value }
              : {}),
          },
        });
      };
      const ids = ['td-color', 'td-font', 'td-size', 'td-text', 'td-bg', 'td-bgc', 'td-bd', 'td-bdc', 'td-wrap', 'td-wrapw'];
      if (isShape) ids.push('td-pos', 'td-align');
      for (const idd of ids) {
        el(idd).addEventListener('input', apply);
        el(idd).addEventListener('change', apply);
      }
      for (const idd of ['td-bold', 'td-italic']) {
        el(idd).addEventListener('click', () => { el(idd).classList.toggle('is-on'); apply(); });
      }
      el('td-x').addEventListener('click', () => closeTextDialog(before));
      el('td-cancel').addEventListener('click', () => closeTextDialog(before));
      el('td-ok').addEventListener('click', () => { apply(); closeTextDialog(null); });

      el('textmodal').hidden = false;
      el('td-text').focus();
    }

    function closeTextDialog(revertTo) {
      if (revertTo && textDlgFor) draw.update(textDlgFor, { style: revertTo });
      el('textmodal').hidden = true;
      textDlgFor = null;
    }

    /** Park the widget above the drawing — until the user drags it somewhere. */
    function positionWidget() {
      const w = el('toolwidget');
      if (w.hidden) return;
      const d = drawingOf(widgetFor);
      if (!d) return;
      if (widgetPos) {
        w.style.left = widgetPos.x + 'px';
        w.style.top = widgetPos.y + 'px';
        return;
      }
      const stage = el('chart').getBoundingClientRect();
      const xs = [];
      const ys = [];
      for (const p of d.points) {
        const cx = chart.timeToCoordinate(p.time);
        const cy = chart.priceToCoordinate(p.price, d.paneIndex);
        if (Number.isFinite(cx)) xs.push(cx);
        if (cy !== null && Number.isFinite(cy)) ys.push(cy);
      }
      const x = xs.length ? Math.min.apply(null, xs) : 60;
      const y = ys.length ? Math.min.apply(null, ys) - 44 : 60;
      w.style.left = Math.max(46, Math.min(stage.width - w.offsetWidth - 8, x)) + 'px';
      w.style.top = Math.max(6, y) + 'px';
    }

    function startWidgetDrag(grip) {
      grip.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const w = el('toolwidget');
        const start = { x: e.clientX, y: e.clientY, left: w.offsetLeft, top: w.offsetTop };
        const move = (ev) => {
          widgetPos = { x: start.left + (ev.clientX - start.x), y: start.top + (ev.clientY - start.y) };
          positionWidget();
          hideColorPop();
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    }

    // ── colour + opacity popover ───────────────────────────────────────────
    function toggleColorPop() {
      const pop = el('colorpop');
      if (!pop.hidden) { hideColorPop(); return; }
      const d = drawingOf(widgetFor);
      if (!d) return;
      const cur = String((d.style && d.style.color) || '#2962ff').toLowerCase();
      const opacity = Math.round(((d.style && d.style.fillOpacity) != null ? d.style.fillOpacity : 0.12) * 100);
      pop.innerHTML =
        '<div class="swgrid"></div>' +
        '<span class="lbl">Opacity</span>' +
        '<div class="poprow"><input type="range" id="popop" min="0" max="100" value="' + opacity + '" />' +
        '<output id="popout">' + opacity + '%</output></div>';
      const grid = pop.querySelector('.swgrid');
      for (const c of SWATCHES) {
        const b = document.createElement('button');
        b.style.background = c;
        b.title = c;
        if (c === cur) b.classList.add('is-on');
        b.addEventListener('click', () => {
          draw.update(widgetFor, { style: { color: c, fillColor: c } });
          showWidget(widgetFor);
          hideColorPop();
        });
        grid.appendChild(b);
      }
      const range = pop.querySelector('#popop');
      range.addEventListener('input', () => {
        pop.querySelector('#popout').textContent = range.value + '%';
        // Opacity drives the shape fill; the stroke keeps full strength, so a
        // faint zone still reads as a zone.
        const v = Number(range.value) / 100;
        draw.update(widgetFor, { style: { fillOpacity: v, fill: v > 0 } });
      });
      const w = el('toolwidget');
      pop.style.left = w.offsetLeft + 'px';
      pop.style.top = (w.offsetTop + w.offsetHeight + 6) + 'px';
      pop.hidden = false;
    }

    function hideColorPop() { el('colorpop').hidden = true; }

    window.addEventListener('pointerdown', (e) => {
      if (!el('colorpop').contains(e.target) && !el('toolwidget').contains(e.target)) hideColorPop();
    });

    // Persist the whole chart state (viewport, panes, indicators, drawings) on
    // every change, so a refresh comes back exactly where it left off. Debounced
    // because drags fire per frame.
    let saveTimer = 0;
    function autosave() {
      if (!chart) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(chart.getState())); } catch (_) {}
      }, 250);
    }

    // ── drawing tools ──────────────────────────────────────────────────────
    // The controller is headless: it owns the model and the interactions, and
    // this toolbar is just a host driving setTool / undo / remove. Drawings
    // persist through chart.getState(), so Layout > Save keeps them.
    let draw = null;
    function attachDrawing() {
      if (draw) draw.destroy();
      draw = new DrawingController(chart, { magnet: el('magnet').checked });
      // The chord table comes from the tier, so the rail can only label its rows
      // once this point is reached.
      if (!Object.keys(SHORTCUTS).length) {
        SHORTCUTS = drawingShortcuts();
        buildRail();
      }
      chart.on('draw:tool', ({ tool }) => syncRail(tool));
      chart.on('draw:add', ({ drawing }) => { el('status').textContent = `drew ${drawing.tool}`; });
      // Selecting a drawing raises its properties bar; deselecting hides it.
      chart.on('draw:select', ({ id }) => showWidget(id));
      // Double-click a selected text drawing to edit it in place.
      el('chart').addEventListener('dblclick', () => {
        const id = draw && draw.selected();
        const d = id ? draw.get(id) : null;
        if (d) openTextDialog(id);
      });
      chart.on('draw:remove', () => { showWidget(null); autosave(); });
      chart.on('draw:update', () => { positionWidget(); autosave(); });
      chart.on('draw:add', autosave);
      for (const ev of ['paneResized', 'paneMoved', 'paneMaximized', 'paneRemoved', 'indicatorRemoved']) {
        chart.on(ev, autosave);
      }
      // Keep the widget glued to its drawing while the chart moves under it.
      for (const ev of ['viewport', 'resize']) chart.on(ev, positionWidget);
      syncRail(draw.activeTool());
    }

    (function fillToolPicker() {
      const sel = el('drawtool');
      const none = document.createElement('option');
      none.value = ''; none.textContent = 'Cursor';
      sel.appendChild(none);
      for (const t of BUILTIN_DRAWING_TOOLS) {
        const o = document.createElement('option');
        o.value = t.id; o.textContent = t.name;
        sel.appendChild(o);
      }
    })();

    el('drawtool').addEventListener('change', () => draw && draw.setTool(el('drawtool').value || null));
    el('drawundo').addEventListener('click', () => draw && draw.undo());
    el('drawredo').addEventListener('click', () => draw && draw.redo());
    el('drawdel').addEventListener('click', () => {
      const id = draw && draw.selected();
      if (id) draw.remove(id);
    });
    el('drawclear').addEventListener('click', () => draw && draw.clear());
    el('magnet').addEventListener('change', () => draw && draw.setOptions({ magnet: el('magnet').checked }));
    // Keyboard: Delete removes the selection, Esc leaves the tool, Ctrl+Z / Y undo-redo.
    window.addEventListener('keydown', (e) => {
      if (!draw || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.key === 'Delete' || e.key === 'Backspace') { const id = draw.selected(); if (id) { draw.remove(id); e.preventDefault(); } }
      else if (e.key === 'Escape') draw.setTool(null);
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.shiftKey ? draw.redo() : draw.undo(); e.preventDefault(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { draw.redo(); e.preventDefault(); }
      else {
        // Alt+<key> arms a tool. The tier owns the chord table and matches the
        // modifiers exactly, so this cannot shadow a browser chord.
        const id = matchDrawingShortcut(e);
        if (id) { draw.setTool(id); syncRail(id); e.preventDefault(); }
      }
    });

    buildRail();
    fillIndicatorPicker();
    renderToolbar();
    // The symbol box is a floating editor raised by the toolbar button.
    el('symbol').addEventListener('blur', () => { el('symbol').classList.remove('is-live'); renderToolbar(); });
    el('symbol').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') { el('symbol').classList.remove('is-live'); renderToolbar(); }
    });
    load();
  </script>
</body>
</html>
